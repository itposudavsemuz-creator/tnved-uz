<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="Товарная номенклатура внешнеэкономической деятельности Республики Узбекистан — быстрый поиск по кодам и наименованиям" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />

    <title>ТН ВЭД РУз — Справочник</title>

    <style>
      /* Стили, которые нужны ДО загрузки React (предотвращают мигание) */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100dvh;
      }
      #root { min-height: 100dvh; }
      /* Экран загрузки */
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
        background: #0f172a;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash .logo {
        font-size: 2.5rem; font-weight: 700;
        color: #3b82f6; letter-spacing: -1px;
      }
      #splash .sub { font-size: 0.9rem; color: #64748b; }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #splash .spinner {
        width: 32px; height: 32px;
        border: 3px solid #1e3a5f;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body>
    <!-- Экран загрузки -->
    <div id="splash">
      <div class="logo">ТН ВЭД</div>
      <div class="sub">Справочник Республики Узбекистан</div>
      <div class="spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Регистрация Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .then((reg) => {
              // Слушаем обновления SW
              reg.addEventListener("updatefound", () => {
                const newWorker = reg.installing;
                newWorker?.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    // Уведомим приложение об обновлении
                    window.dispatchEvent(new CustomEvent("sw-update-available"));
                  }
                });
              });
            })
            .catch(console.error);
        });
      }
    </script>
  </body>
</html>
