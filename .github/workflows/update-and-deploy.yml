name: Update ТН ВЭД data & Deploy

on:
  # Автозапуск по расписанию — каждую субботу в 02:00 UTC
  schedule:
    - cron: "0 2 * * 6"

  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:
    inputs:
      strategy:
        description: "Стратегия парсинга"
        required: false
        default: "auto"
        type: choice
        options: [auto, ajax, html, seed]
      force_deploy:
        description: "Деплоить даже если данные не изменились"
        required: false
        default: false
        type: boolean

  # Деплой при каждом push в main (без парсинга)
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Обновление данных (только по расписанию / вручную)
  # ─────────────────────────────────────────────────────────────────
  update-data:
    name: Обновить данные ТН ВЭД
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      data_changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scraper/requirements.txt"

      - name: Установить зависимости
        run: pip install -r scraper/requirements.txt

      - name: Запустить парсер
        run: |
          STRATEGY="${{ github.event.inputs.strategy || 'auto' }}"
          echo "Стратегия: $STRATEGY"
          python scraper/scraper.py --strategy "$STRATEGY" --output public/data
        env:
          PYTHONUNBUFFERED: "1"

      - name: Проверить изменения в данных
        id: check
        run: |
          if git diff --quiet public/data/tnved.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Данные не изменились"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            LINES=$(wc -l < public/data/tnved.json)
            echo "Данные обновлены (строк JSON: $LINES)"
          fi

      - name: Закоммитить обновлённые данные
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tnved.json public/data/meta.json
          git commit -m "chore: обновление ТН ВЭД $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Сборка React-приложения
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Сборка приложения
    runs-on: ubuntu-latest
    needs: [update-data]
    # Запускаем: после update-data (если он был) ИЛИ при push в main
    if: |
      always() &&
      (needs.update-data.result == 'success' ||
       needs.update-data.result == 'skipped' ||
       github.event_name == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Получаем свежую версию (с возможно обновлёнными данными)
          ref: main

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установить зависимости
        run: npm ci

      - name: Сборка
        run: npm run build
        env:
          # Нужно для GitHub Pages — замените на ваш username/repo
          VITE_BASE_URL: "/${{ github.event.repository.name }}/"

      - name: Загрузить артефакт деплоя
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Деплой на GitHub Pages
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Деплой на GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
